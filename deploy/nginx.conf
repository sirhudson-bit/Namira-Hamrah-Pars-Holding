# Namira Holding — nginx reverse proxy.
# Installed by deploy/bootstrap.sh to /etc/nginx/sites-available/namira
# (__DOMAIN__ and __PORT__ are substituted at install time).
# Certbot rewrites this file when you run `certbot --nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Server-action uploads are capped at 6 MB in next.config.ts; leave headroom
    # for multipart framing so nginx rejects nothing the app accepts.
    client_max_body_size 8m;

    # Uploaded media is served by the app from storage/uploads.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Never expose dotfiles or the SQLite file if the root ever changes.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
